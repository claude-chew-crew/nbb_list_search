{% extends "base.html" %}
{% block content %}
<form method="post">
    <input type="text" name="query" placeholder="Enter search term" size="40">
    <select name="sheet">
        <option value="All" {% if selected=="All" %}selected{% endif %}>All Sheets</option>
        {% for s in sheets %}
            <option value="{{ s }}" {% if selected==s %}selected{% endif %}>{{ s }}</option>
        {% endfor %}
    </select>
    <button type="submit">Search</button>
</form>
{% endblock %}
